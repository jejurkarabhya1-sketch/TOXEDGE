    <style>
        :root {
            --primary: linear-gradient(135deg, #1e3a8a, #3b82f6);
            --secondary: rgba(255,255,255,0.1);
            --glass-bg: rgba(255,255,255,0.08);
            --border-glass: rgba(255,255,255,0.2);
            --text-primary: #f8fafc;
            --text-secondary: rgba(248,250,252,0.8);
        }
        * { box-sizing: border-box; margin: 0; }
        body { 
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            min-height: 100vh;
            color: var(--text-primary);
            line-height: 1.6;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .dev-card {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            border-radius: 24px;
            border: 1px solid var(--border-glass);
            padding: 3rem 2.5rem;
            width: 100%; max-width: 500px;
            box-shadow: 0 25px 60px -15px rgba(0,0,0,0.4);
            text-align: center;
        }
        .dev-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: var(--primary);
            margin: 0 auto 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            color: white;
            box-shadow: 0 15px 35px rgba(59,130,246,0.4);
        }
        .dev-name {
            font-size: clamp(2rem, 5vw, 2.8rem);
            font-weight: 700;
            background: var(--primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }
        .dev-role {
            font-size: 1.3rem;
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
            font-weight: 500;
        }
        .dev-info {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border-glass);
        }
        .dev-info h3 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }
        .dev-contact {
            font-size: 1.1rem;
            color: var(--text-secondary);
            word-break: break-all;
        }
        .linkedin-section {
            margin-bottom: 1.5rem;
        }
        .linkedin-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #0077B5, #0A66C2);
            border-radius: 50%;
            text-decoration: none;
            box-shadow: 0 15px 35px rgba(0, 118, 181, 0.5), 0 0 0 4px rgba(255,255,255,0.2);
            transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
            position: relative;
            overflow: hidden;
        }
        .linkedin-logo::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: white;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .linkedin-logo:hover {
            transform: translateY(-5px) scale(1.08);
            box-shadow: 0 25px 50px rgba(0, 118, 181, 0.6), 0 0 0 6px rgba(255,255,255,0.3);
        }
        .linkedin-logo:hover::before {
            opacity: 1;
        }
        .linkedin-logo i {
            font-size: 2.8rem;
            color: white;
            z-index: 1;
            position: relative;
        }

        .dev-footer {
            margin-top: 2.5rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border-glass);
            opacity: 0.8;
            font-size: 0.95rem;
        }
        .whatsapp-logo, .client-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #25D366, #128C7E);
            border-radius: 50%;
            text-decoration: none;
            box-shadow: 0 15px 35px rgba(37, 211, 102, 0.5), 0 0 0 4px rgba(255,255,255,0.2);
            transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
            position: relative;
            overflow: hidden;
            font-size: 1.4rem;
            font-weight: 600;
            color: white;
        }
        .whatsapp-logo:hover, .client-logo:hover {
            transform: translateY(-5px) scale(1.08);
            box-shadow: 0 25px 50px rgba(37, 211, 102, 0.6), 0 0 0 6px rgba(255,255,255,0.3);
        }
        .client-logo {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
        }
        .client-logo:hover {
            box-shadow: 0 25px 50px rgba(30, 58, 138, 0.6), 0 0 0 6px rgba(255,255,255,0.3);
        }
        .whatsapp-section, .client-section {
            margin-bottom: 1.5rem;
        }
        @media (max-width: 480px) {
            .dev-card { padding: 2rem 1.5rem; margin: 1rem; }
        }
    </style>
</head>
